<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="hand" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#hand)" fill="none" stroke="#C0846B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 外框 -->
    <rect x="6" y="10" width="36" height="28" rx="3" fill="#F5E6DC" stroke-width="2.2"/>
    <!-- 箭头 -->
    <path d="M18 20l6 4-6 4" stroke-width="2.5"/>
    <!-- 分享节点 -->
    <circle cx="28" cy="16" r="2.5" fill="#C0846B" stroke="none"/>
    <circle cx="28" cy="24" r="2.5" fill="#C0846B" stroke="none"/>
    <circle cx="28" cy="32" r="2.5" fill="#C0846B" stroke="none"/>
    <!-- 连线 -->
    <path d="M25.5 17.5l-4.5 2.5M25.5 30.5l-4.5-2.5" stroke-width="1.8"/>
  </g>
</svg>
