<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>04 · 照片上传 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-photo-upload" data-screen="04-photo-upload.html">
  <header class="nav">
    <button class="nav-btn" data-nav="03-body-params.html" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <span class="nav-title">步骤3/3 照片上传（选填）</span>
  </header>

  <main class="content">
    <div class="steps" aria-label="步骤 3/3">
      <i class="on"></i><i class="on"></i><i class="on"></i>
    </div>
    <p class="subtitle">上传照片可以让数字人更像你，均为选填。</p>

    <button class="upload-card" data-sheet="photoSheet" id="faceCard" data-od-id="wizard-face-card">
      <span class="uc-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
      <span class="uc-main">
        <h4>人脸正面照</h4>
        <p>正面照、光线均匀 · jpg/png ≤ 10MB</p>
      </span>
      <span class="uc-state" id="faceState">跳过</span>
    </button>

    <button class="upload-card" data-sheet="photoSheet" id="bodyCard" data-od-id="wizard-body-card">
      <span class="uc-ic"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-6.5 8-6.5s8 2 8 6.5"/></svg></span>
      <span class="uc-main">
        <h4>全身照（选填）</h4>
        <p>用于肤色与体态校准 · 可跳过</p>
      </span>
      <span class="uc-state" id="bodyState">跳过</span>
    </button>

    <p class="step-note">不上传时使用按性别生成的默认形象；人脸照片属敏感个人信息，将单独授权、加密存储。中途退出会自动保存。</p>
  </main>

  <div class="footer-bar">
    <button class="btn" data-nav="09-privacy-auth.html" data-od-id="wizard-generate">生成数字人</button>
  </div>

  <div class="sheet-mask" id="photoSheet">
    <div class="sheet">
      <div class="grab"></div>
      <h3>选择照片</h3>
      <p>建议正面照、光线均匀；jpg / png ≤ 10MB，仅用于生成数字人。</p>
      <div class="s-actions" style="flex-direction:column;gap:0;margin-top:10px">
        <button class="s-row" data-close="photoSheet" data-toast="已模拟从相册选择照片">从相册选择</button>
        <button class="s-row" data-close="photoSheet" data-toast="已模拟拍照上传">拍照</button>
      </div>
    </div>
  </div>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
  <script>
    function markDone(cardId, stateId) {
      var card = document.getElementById(cardId);
      var state = document.getElementById(stateId);
      card.classList.add("done");
      state.textContent = "已上传";
    }
    document.getElementById("photoSheet").querySelectorAll(".s-row").forEach(function (row) {
      row.addEventListener("click", function () {
        if (document.getElementById("faceCard").classList.contains("done") === false) {
          markDone("faceCard", "faceState");
        } else {
          markDone("bodyCard", "bodyState");
        }
      });
    });
  </script>
</body>
</html>
