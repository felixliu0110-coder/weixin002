<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>我形我衣 · 小程序原型预览器</title>
  <style>
    :root {
      --chrome: #171512;
      --chrome-2: #1F1C19;
      --chrome-3: #26221E;
      --line: rgba(237, 233, 226, 0.12);
      --ink: #EDE9E2;
      --ink-2: #A79E92;
      --accent: #E3A595;
      --accent-deep: #C98F80;
      --accent-soft: rgba(227, 165, 149, 0.16);
      --on-accent: #FFFFFF;
      --backdrop: #EFEAE2;
      --stage-bg: #12100E;
      --ease: cubic-bezier(0.28, 0, 0.22, 1);
      --font-mono: ui-monospace, "SF Mono", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--chrome);
      color: var(--ink);
      font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }

    /* ---------- 顶栏 ---------- */
    .l-head {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      background: var(--chrome-2);
    }
    .brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
    .brand .logo { font-size: 19px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; }
    .brand .logo b { color: var(--accent); font-weight: 700; }
    .brand .tag { font-size: 12px; color: var(--ink-2); letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .l-actions { display: flex; align-items: center; gap: 10px; }
    .seg {
      display: flex;
      gap: 3px;
      padding: 3px;
      background: var(--chrome-3);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--ink-2);
      font-size: 12.5px;
      letter-spacing: 0.01em;
      padding: 7px 12px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .seg button:focus-visible, .l-actions > button:focus-visible, .rail a:focus-visible, .rail button:focus-visible,
    .dots button:focus-visible, .stage-foot button:focus-visible, .panel .close-row button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .l-actions > button {
      border: 1px solid var(--line);
      background: var(--chrome-3);
      color: var(--ink);
      font-size: 12.5px;
      padding: 8px 14px;
      border-radius: 10px;
    }
    .l-actions > button:hover { border-color: var(--accent); color: var(--accent); }
    .l-actions > button.on {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* ---------- 主体 ---------- */
    .l-body { flex: 1 1 auto; display: flex; min-height: 0; }
    .rail {
      flex: 0 0 268px;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      background: var(--chrome-2);
      padding: 14px 12px 20px;
    }
    .rail::-webkit-scrollbar, .stage-canvas::-webkit-scrollbar { width: 8px; }
    .rail::-webkit-scrollbar-thumb { background: var(--chrome-3); border-radius: 4px; }
    .group-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--ink-2);
      margin: 14px 8px 7px;
    }
    .rail a {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 9px;
      border-radius: 10px;
      color: var(--ink);
      text-decoration: none;
      font-size: 13.5px;
      border: 1px solid transparent;
    }
    .rail a:hover { background: var(--chrome-3); }
    .rail a.on { background: var(--accent-soft); border-color: rgba(227, 165, 149, 0.35); }
    .rail a .no {
      flex: 0 0 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: var(--chrome-3);
      color: var(--ink-2);
      font-size: 11px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .rail a.on .no { background: var(--accent); color: var(--on-accent); }
    .rail a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rail a .prd {
      font-size: 10px;
      color: var(--ink-2);
      background: var(--chrome-3);
      border-radius: 999px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .stage { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .stage-top {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px 8px;
    }
    .stage-top h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .stage-top .meta { font-size: 12px; color: var(--ink-2); }
    .stage-canvas {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: auto;
      padding: 14px 20px 10px;
      background: var(--stage-bg);
    }
    .dev-wrap { position: relative; transform-origin: top center; }
    .dev-wrap iframe {
      display: block;
      border: 0;
      border-radius: 6px;
      background: var(--backdrop);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.35), 0 2px 8px rgba(0, 0, 0, 0.22);
    }
    .stage-hint {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: var(--backdrop);
      color: var(--ink-2);
      font-size: 12.5px;
      letter-spacing: 0.02em;
      border-radius: 6px;
      opacity: 1;
      transition: opacity 0.2s var(--ease);
      pointer-events: none;
    }
    .stage-hint.hide { opacity: 0; }
    .sh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: sh-pulse 1.2s ease-in-out infinite;
    }
    @keyframes sh-pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .stage-foot {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 10px 20px;
      border-top: 1px solid var(--line);
      background: var(--chrome-2);
    }
    .stage-foot button {
      border: 1px solid var(--line);
      background: var(--chrome-3);
      color: var(--ink);
      border-radius: 10px;
      padding: 7px 16px;
      font-size: 12.5px;
      min-width: 84px;
    }
    .stage-foot button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .stage-foot button:disabled { opacity: 0.35; cursor: default; }
    .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
    .dots button {
      width: 10px; height: 10px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: rgba(237, 233, 226, 0.18);
      transition: background 0.18s var(--ease), transform 0.18s var(--ease);
    }
    .dots button.on { background: var(--accent); transform: scale(1.2); }

    /* ---------- PRD 映射弹层 ---------- */
    .mask {
      position: fixed;
      inset: 0;
      background: rgba(10, 9, 8, 0.66);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 90;
      padding: 24px;
    }
    .mask.show { display: flex; }
    .panel {
      width: min(860px, 100%);
      max-height: 86vh;
      overflow-y: auto;
      overflow-x: auto;
      background: var(--chrome-2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
    }
    .panel h2 { margin: 0 0 4px; font-size: 17px; }
    .panel .sub { margin: 0 0 16px; font-size: 12.5px; color: var(--ink-2); line-height: 1.7; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--ink-2); font-weight: 500; font-size: 11.5px; letter-spacing: 0.05em; }
    td .fname { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--ink-2); }
    .panel .close-row { display: flex; justify-content: flex-end; margin-top: 16px; }
    .panel .close-row button {
      border: 1px solid var(--line);
      background: var(--chrome-3);
      color: var(--ink);
      border-radius: 9px;
      padding: 8px 18px;
      font-size: 13px;
    }
    .panel .close-row button:hover { border-color: var(--accent); color: var(--accent); }

    /* ---------- 移动端 ---------- */
    .rail-toggle { display: none; }
    @media (max-width: 860px) {
      .l-head { flex-wrap: wrap; }
      .brand .tag { display: none; }
      .rail {
        position: fixed;
        inset: 0 0 0 auto;
        width: min(300px, 84vw);
        z-index: 80;
        transform: translateX(102%);
        transition: transform 0.24s ease;
        box-shadow: -20px 0 50px rgba(0, 0, 0, 0.4);
      }
      .rail.open { transform: none; }
    .rail-toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      border: 1px solid var(--line);
      background: var(--chrome-3);
      color: var(--ink);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12.5px;
    }
      .l-actions .seg { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <header class="l-head">
    <div class="brand">
      <span class="logo">我形<b>我衣</b></span>
      <span class="tag">17 屏小程序原型 · PRD v1.0</span>
    </div>
    <div class="l-actions">
      <button class="rail-toggle" id="railToggle" type="button">屏幕列表</button>
      <div class="seg" id="modeSeg" role="group" aria-label="预览模式">
        <button data-mode="plain" class="on">设计稿</button>
        <button data-mode="ios">iPhone 15 Pro</button>
        <button data-mode="android">Android Pixel</button>
      </div>
      <button id="autoBtn" type="button">自动演示</button>
      <button id="mapBtn" type="button">PRD 映射</button>
    </div>
  </header>

  <div class="l-body">
    <aside class="rail" id="rail"></aside>
    <main class="stage">
      <div class="stage-top">
        <h1 id="screenTitle">屏幕预览</h1>
        <span class="meta" id="screenMeta"></span>
      </div>
      <div class="stage-canvas" id="canvas">
        <div class="dev-wrap" id="devWrap">
          <div class="stage-hint" id="stageHint" aria-hidden="true">
            <span class="sh-dot"></span>
            <span id="hintText">正在加载…</span>
          </div>
          <iframe id="previewFrame" title="屏幕预览"></iframe>
        </div>
      </div>
      <div class="stage-foot">
        <button id="prevBtn" type="button">上一屏</button>
        <div class="dots" id="dots"></div>
        <button id="nextBtn" type="button">下一屏</button>
      </div>
    </main>
  </div>

  <div class="mask" id="mapMask">
    <div class="panel" role="dialog" aria-modal="true" aria-label="PRD 映射表">
      <h2>图片 ↔ 屏幕 ↔ PRD 对应关系</h2>
      <p class="sub">原型以你提供的 17 张关键图为唯一视觉来源：主体内容（插画、照片、3D 形象、配色）逐像素保留，未做任何删改；仅在原图之上叠加了可交互按钮、Tab 与提示层，用于演示跳转与操作状态。</p>
      <table>
        <thead><tr><th>图片文件</th><th>屏幕</th><th>对应 PRD 章节 / 需求</th></tr></thead>
        <tbody id="mapBody"></tbody>
      </table>
      <div class="close-row"><button id="mapClose" type="button">关闭</button></div>
    </div>
  </div>

  <script>
    (function () {
      "use strict";

      var SCREENS = [
        { id: "17-home.html", name: "首页", prd: "FR-12 / FR-13", group: "首页与登录", file: "page_17_home" },
        { id: "01-login.html", name: "登录", prd: "FR-01", group: "首页与登录", file: "page_01_login" },
        { id: "02-basic-info.html", name: "基本信息", prd: "FR-04 / FR-05", group: "数字人创建", file: "page_02_basic_info" },
        { id: "03-body-params.html", name: "身材参数", prd: "FR-04 / FR-05", group: "数字人创建", file: "page_03_body_params" },
        { id: "04-photo-upload.html", name: "照片上传", prd: "FR-06 / FR-06a / FR-07", group: "数字人创建", file: "page_04_photo_upload" },
        { id: "09-privacy-auth.html", name: "隐私授权", prd: "FR-03 / C-03", group: "数字人创建", file: "page_09_privacy_auth" },
        { id: "10-generate-progress.html", name: "生成数字人", prd: "FR-08 / NFR-01", group: "数字人创建", file: "page_10_generate_progress" },
        { id: "05-3d-viewer.html", name: "我的数字人 3D", prd: "FR-09 / FR-10 / FR-12", group: "数字人创建", file: "page_05_3d_viewer" },
        { id: "06-tryon-select.html", name: "选择衣物", prd: "FR-13 / FR-14", group: "试穿链路", file: "page_06_tryon_select" },
        { id: "11-image-preview.html", name: "衣物预览", prd: "FR-15 / FR-16", group: "试穿链路", file: "page_11_image_preview" },
        { id: "12-tryon-progress.html", name: "试穿生成中", prd: "FR-16 / FR-16a / FR-21", group: "试穿链路", file: "page_12_tryon_progress" },
        { id: "07-tryon-result.html", name: "试穿结果", prd: "FR-17 / FR-18 / FR-19", group: "试穿链路", file: "page_07_tryon_result" },
        { id: "14-compare-view.html", name: "对比视图", prd: "FR-20", group: "试穿链路", file: "page_14_compare_view" },
        { id: "08-profile.html", name: "个人中心", prd: "FR-22 ~ FR-26", group: "我的与隐私", file: "page_08_profile" },
        { id: "13-tryon-history.html", name: "试穿记录", prd: "FR-18 / FR-23", group: "我的与隐私", file: "page_13_tryon_history" },
        { id: "15-privacy-manage.html", name: "隐私与数据管理", prd: "FR-11 / FR-25 / C-03", group: "我的与隐私", file: "page_15_privacy_manage" },
        { id: "16-feedback-about.html", name: "反馈与关于", prd: "FR-26 / C-01 / C-02 / C-05", group: "我的与隐私", file: "page_16_feedback_about" }
      ];

      var rail = document.getElementById("rail");
      var frame = document.getElementById("previewFrame");
      var devWrap = document.getElementById("devWrap");
      var canvas = document.getElementById("canvas");
      var dots = document.getElementById("dots");
      var title = document.getElementById("screenTitle");
      var meta = document.getElementById("screenMeta");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var autoBtn = document.getElementById("autoBtn");
      var stageHint = document.getElementById("stageHint");
      var hintText = document.getElementById("hintText");
      var modeSeg = document.getElementById("modeSeg");
      var autoTimer = null;

      var mode = localStorage.getItem("woxy-mode") || "plain";
      var idx = parseInt(localStorage.getItem("woxy-idx") || "0", 10);
      if (!SCREENS[idx]) idx = 0;
      var initHash = (location.hash || "").replace(/^#s\//, "");
      if (initHash) {
        var hi = SCREENS.findIndex(function (s) { return s.id === initHash; });
        if (hi >= 0) idx = hi;
      }

      var SIZES = { plain: [390, 769], ios: [390, 844], android: [412, 900] };
      var ASSET_V = "v=19";

      function frameSrc(i, m) {
        if (m === "ios") return "/frames/iphone-15-pro.html?screen=screens/" + SCREENS[i].id + "?" + ASSET_V;
        if (m === "android") return "/frames/android-pixel.html?screen=screens/" + SCREENS[i].id + "?" + ASSET_V;
        return "screens/" + SCREENS[i].id + "?" + ASSET_V;
      }

      function fitScale() {
        var ch = canvas.clientHeight - 28;
        var cw = canvas.clientWidth - 40;
        var w = SIZES[mode][0], h = SIZES[mode][1];
        var s = Math.min(1, ch / h, cw / w);
        frame.width = w;
        frame.height = h;
        devWrap.style.transform = "scale(" + s + ")";
        devWrap.style.height = (h * s) + "px";
        devWrap.style.width = (w * s) + "px";
      }

      function setSeg() {
        var btns = modeSeg.querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) {
          btns[i].classList.toggle("on", btns[i].getAttribute("data-mode") === mode);
        }
      }

      function render() {
        var s = SCREENS[idx];
        frame.src = frameSrc(idx, mode);
        title.textContent = (idx + 1) + " · " + s.name;
        meta.textContent = "PRD：" + s.prd;
        hintText.textContent = "正在加载 " + (idx + 1) + " · " + s.name + "…";
        stageHint.classList.remove("hide");
        localStorage.setItem("woxy-idx", String(idx));
        localStorage.setItem("woxy-mode", mode);
        var links = rail.querySelectorAll("a");
        for (var i = 0; i < links.length; i++) {
          links[i].classList.toggle("on", links[i].getAttribute("data-idx") === String(idx));
        }
        var ds = dots.querySelectorAll("button");
        for (var j = 0; j < ds.length; j++) {
          ds[j].classList.toggle("on", j === idx);
        }
        prevBtn.disabled = idx === 0;
        nextBtn.disabled = idx === SCREENS.length - 1;
        fitScale();
      }

      function go(i, fromNav) {
        i = Math.max(0, Math.min(SCREENS.length - 1, i));
        if (i === idx && !fromNav) return;
        idx = i;
        render();
        if (location.hash !== "s/" + SCREENS[idx].id) {
          try { location.hash = "s/" + SCREENS[idx].id; } catch (e) { /* 忽略 */ }
        }
      }

      /* ---------- 构建侧栏 ---------- */
      (function buildRail() {
        var lastGroup = null;
        SCREENS.forEach(function (s, i) {
          if (s.group !== lastGroup) {
            lastGroup = s.group;
            var g = document.createElement("div");
            g.className = "group-label";
            g.textContent = s.group;
            rail.appendChild(g);
          }
          var a = document.createElement("a");
          a.href = "#s/" + s.id;
          a.setAttribute("data-idx", String(i));
          a.innerHTML = '<span class="no">' + String(i + 1).padStart(2, "0") + '</span><span class="nm"></span><span class="prd"></span>';
          a.querySelector(".nm").textContent = s.name;
          a.querySelector(".prd").textContent = s.prd;
          rail.appendChild(a);
        });
      })();

      /* ---------- 圆点 ---------- */
      (function buildDots() {
        for (var i = 0; i < SCREENS.length; i++) {
          (function (n) {
            var d = document.createElement("button");
            d.type = "button";
            d.title = SCREENS[n].name;
            d.setAttribute("aria-label", "前往 " + SCREENS[n].name);
            d.addEventListener("click", function () { stopAuto(); go(n); });
            dots.appendChild(d);
          })(i);
        }
      })();

      frame.addEventListener("load", function () {
        stageHint.classList.add("hide");
      });

      /* ---------- 模式 / 导航 ---------- */
      modeSeg.addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-mode]");
        if (!b) return;
        stopAuto();
        mode = b.getAttribute("data-mode");
        setSeg();
        render();
      });

      prevBtn.addEventListener("click", function () { stopAuto(); go(idx - 1); });
      nextBtn.addEventListener("click", function () { stopAuto(); go(idx + 1); });

      function stopAuto() {
        if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
        autoBtn.textContent = "自动演示";
        autoBtn.classList.remove("on");
      }
      autoBtn.addEventListener("click", function () {
        if (autoTimer) { stopAuto(); return; }
        autoBtn.textContent = "停止演示";
        autoBtn.classList.add("on");
        autoTimer = setInterval(function () { go(idx + 1); }, 3600);
      });

      /* ---------- 屏幕内跳转：hash + postMessage ---------- */
      window.addEventListener("hashchange", function () {
        var h = (location.hash || "").replace(/^#s\//, "");
        if (!h) return;
        var i = SCREENS.findIndex(function (s) { return s.id === h; });
        if (i >= 0) { stopAuto(); go(i, true); }
      });
      window.addEventListener("message", function (ev) {
        if (ev.data && ev.data.type === "od-nav" && ev.data.to) {
          var i = SCREENS.findIndex(function (s) { return s.id === ev.data.to; });
          if (i >= 0) { stopAuto(); go(i, true); }
        }
      });

      /* ---------- PRD 映射 ---------- */
      var mapBody = document.getElementById("mapBody");
      SCREENS.forEach(function (s) {
        var tr = document.createElement("tr");
        var td1 = document.createElement("td");
        var code = document.createElement("div");
        code.className = "fname";
        code.textContent = s.file + ".png.jpeg";
        td1.appendChild(code);
        var td2 = document.createElement("td");
        td2.textContent = s.name;
        var td3 = document.createElement("td");
        td3.textContent = s.prd;
        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
        mapBody.appendChild(tr);
      });

      document.getElementById("mapBtn").addEventListener("click", function () {
        document.getElementById("mapMask").classList.add("show");
      });
      document.getElementById("mapClose").addEventListener("click", function () {
        document.getElementById("mapMask").classList.remove("show");
      });
      document.getElementById("mapMask").addEventListener("click", function (ev) {
        if (ev.target === this) this.classList.remove("show");
      });

      /* ---------- 移动端侧栏 ---------- */
      var railToggle = document.getElementById("railToggle");
      railToggle.addEventListener("click", function () { rail.classList.toggle("open"); });
      rail.addEventListener("click", function (ev) {
        if (ev.target.closest("a")) rail.classList.remove("open");
      });

      window.addEventListener("resize", fitScale);
      setSeg();
      render();
    })();
  </script>
</body>
</html>
