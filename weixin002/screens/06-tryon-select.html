<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>06 · 选择衣物 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-tryon-select" data-screen="06-tryon-select.html">
  <header class="nav">
    <button class="nav-btn" data-nav="17-home.html" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <span class="nav-title">选择衣物</span>
  </header>

  <main class="content">
    <div class="seg" style="margin-bottom:16px" data-od-id="tryon-tabs">
      <button class="on" data-toast="已显示模板衣物库">模板衣物</button>
      <button data-sheet="uploadSheet" data-od-id="tryon-tab-upload">上传衣物</button>
    </div>

    <p class="hint" style="margin:0 2px 12px">选择一件衣物，AI 将按你的数字人体型生成试穿效果。</p>

    <div class="empty-state" id="libEmpty" role="status">
      <span class="es-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5a2.5 2.5 0 1 1 2.4 3.2H9.6A2.5 2.5 0 0 1 12 6.5Z"/><path d="M6.5 11.5 4 18h16l-2.5-6.5"/><path d="M8 12h8"/></svg></span>
      <p>暂无模板衣物，试试上传一件</p>
      <button class="btn secondary sm" data-sheet="uploadSheet">上传衣物</button>
    </div>

    <div class="garment-grid" data-od-id="garment-grid">
      <button class="garment" data-garment="白色基础T恤" data-od-id="garment-tee">
        <span class="g-img"><img src="../assets/img/p06-tee.png?v=7" alt="白色圆领短袖T恤"></span>
        <span class="pick"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
        <span class="g-name">白色基础T恤</span>
        <span class="g-cat">上装</span>
      </button>
      <button class="garment" data-garment="蓝色条纹衬衫" data-od-id="garment-shirt">
        <span class="g-img"><img src="../assets/img/p06-shirt.png?v=7" alt="蓝色长袖衬衫"></span>
        <span class="pick"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
        <span class="g-name">蓝色条纹衬衫</span>
        <span class="g-cat">上装</span>
      </button>
      <button class="garment" data-garment="米白连帽卫衣" data-od-id="garment-hoodie">
        <span class="g-img"><img src="../assets/img/p06-hoodie.png?v=7" alt="米白色连帽卫衣"></span>
        <span class="pick"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
        <span class="g-name">米白连帽卫衣</span>
        <span class="g-cat">上装</span>
      </button>
      <button class="garment" data-garment="蓝色直筒牛仔裤" data-od-id="garment-jeans">
        <span class="g-img"><img src="../assets/img/p06-jeans.png?v=7" alt="蓝色直筒牛仔裤"></span>
        <span class="pick"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
        <span class="g-name">蓝色直筒牛仔裤</span>
        <span class="g-cat">下装</span>
      </button>
      <button class="garment" data-garment="浅灰休闲裤" data-od-id="garment-pants">
        <span class="g-img"><img src="../assets/img/p06-pants.png?v=7" alt="浅灰色休闲长裤"></span>
        <span class="pick"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
        <span class="g-name">浅灰休闲裤</span>
        <span class="g-cat">下装</span>
      </button>
      <button class="garment" data-garment="粉色半身裙" data-od-id="garment-skirt">
        <span class="g-img"><img src="../assets/img/p06-skirt.png?v=7" alt="粉色A字半身裙"></span>
        <span class="pick"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
        <span class="g-name">粉色半身裙</span>
        <span class="g-cat">下装</span>
      </button>
    </div>
  </main>

  <div class="footer-bar">
    <button class="btn" id="startTryon" data-od-id="tryon-start" disabled>开始试穿</button>
  </div>

  <div class="sheet-mask" id="uploadSheet">
    <div class="sheet">
      <div class="grab"></div>
      <h3>上传衣物</h3>
      <p>拍照或从相册选择，AI 自动识别品类并抠图；jpg / png ≤ 20MB，非衣物图片将被拦截。</p>
      <div class="s-actions" style="flex-direction:column;gap:0;margin-top:10px">
        <button class="s-row" data-close="uploadSheet" data-toast="已从相册选择衣物，进入预处理">从相册选择</button>
        <button class="s-row" data-close="uploadSheet" data-toast="已拍照上传，进入预处理">拍照</button>
      </div>
    </div>
  </div>

  <nav class="tabbar" data-od-id="tryon-tabbar">
    <button data-nav="17-home.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>发现</button>
    <button class="on" data-nav="06-tryon-select"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5a2.5 2.5 0 1 1 2.4 3.2H9.6A2.5 2.5 0 0 1 12 6.5Z"/><path d="M6.5 11.5 4 18h16l-2.5-6.5"/><path d="M8 12h8"/></svg>试衣</button>
    <button data-nav="13-tryon-history.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9Z"/></svg>收藏</button>
    <button data-nav="08-profile.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-6.5 8-6.5s8 2 8 6.5"/></svg>我的</button>
  </nav>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
  <script>
    var startBtn = document.getElementById("startTryon");
    function refreshStart() {
      var n = document.querySelectorAll("[data-garment].on").length;
      startBtn.disabled = n === 0;
      startBtn.textContent = n > 0 ? "开始试穿（已选 " + n + " 件）" : "开始试穿";
    }
    document.addEventListener("od:garment", function (ev) {
      var n = ev.detail.count;
      startBtn.disabled = n === 0;
      startBtn.textContent = n > 0 ? "开始试穿（已选 " + n + " 件）" : "开始试穿";
    });
    startBtn.addEventListener("click", function () {
      var n = document.querySelectorAll("[data-garment].on").length;
      if (!n) { OD.toast("请先选择一件衣物"); return; }
      OD.nav("12-tryon-progress.html");
    });
    document.getElementById("uploadSheet").querySelectorAll(".s-row").forEach(function (row) {
      row.addEventListener("click", function () {
        setTimeout(function () { OD.nav("11-image-preview.html"); }, 1000);
      });
    });
  </script>
</body>
</html>
