<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>01 · 登录 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-login" data-screen="01-login.html">
  <main class="content big-hero-center">
    <h1 class="login-title" style="margin-top:34px">我形<b>我衣</b></h1>
    <p class="login-tag">看见每一件衣服穿在自己身上的样子</p>
    <div class="hero-art" style="margin-top:24px">
      <img src="../assets/img/p01-hero.png?v=5" alt="三位不同穿搭的女性插画，展示虚拟试衣效果">
    </div>

    <button class="check-row on" id="agreeRow" data-od-id="login-agree" aria-pressed="true">
      <span class="box"><svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg></span>
      <p>我已阅读并同意<b>《用户协议》</b>和<b>《隐私政策》</b></p>
    </button>

    <button class="btn block" style="margin-top:22px" data-nav="02-basic-info.html" data-od-id="login-cta">微信授权登录</button>
  </main>

  <nav class="tabbar" data-od-id="login-tabbar">
    <button class="on" data-nav="17-home"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>发现</button>
    <button data-nav="06-tryon-select.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5a2.5 2.5 0 1 1 2.4 3.2H9.6A2.5 2.5 0 0 1 12 6.5Z"/><path d="M6.5 11.5 4 18h16l-2.5-6.5"/><path d="M8 12h8"/></svg>试衣</button>
    <button data-nav="13-tryon-history.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9Z"/></svg>收藏</button>
    <button data-nav="08-profile.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-6.5 8-6.5s8 2 8 6.5"/></svg>我的</button>
  </nav>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
  <script>
    document.getElementById("agreeRow").addEventListener("click", function () {
      var on = this.classList.toggle("on");
      this.setAttribute("aria-pressed", on ? "true" : "false");
      OD.toast(on ? "已同意《用户协议》和《隐私政策》" : "需同意协议后才能使用人脸相关功能");
    });
  </script>
</body>
</html>
