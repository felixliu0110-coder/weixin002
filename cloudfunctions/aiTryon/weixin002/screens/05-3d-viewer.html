<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>05 · 我的数字人 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-3d-viewer" data-screen="05-3d-viewer.html">
  <header class="nav">
    <button class="nav-btn" data-nav="17-home.html" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <span class="nav-title">我的数字人</span>
  </header>

  <main class="content">
    <div class="avatar-stage">
      <img src="../assets/img/p05-avatar.png" alt="3D 数字人全身形象" onerror="this.classList.add('err'); this.nextElementSibling.classList.add('show')">
      <div class="stage-fallback" role="img" aria-label="3D 数字人形象加载失败">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8a4 4 0 1 1 4 4"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><path d="M5.5 19.5c1-3.2 3.5-4.5 6.5-4.5s5.5 1.3 6.5 4.5"/></svg>
        <span>形象加载失败，请刷新重试</span>
      </div>
    </div>
    <p class="meas-hint">单指旋转 · 双指缩放 · 点按标注查看尺寸</p>

    <div class="circle-actions" data-od-id="avatar-controls">
      <button class="circle-btn" data-toast="已切换旋转视图（示意）" aria-label="旋转视图">
        <svg class="ic" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        <span>旋转</span>
      </button>
      <button class="circle-btn" data-toast="身材标注模式已开启（示意）" aria-label="身材标注">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="10" width="18" height="5" rx="1.5" transform="rotate(-45 12 12)"/><path d="m8 8 1.5 1.5"/><path d="m11 5 1.5 1.5"/></svg>
        <span>标注</span>
      </button>
      <button class="circle-btn" data-toast="身材档案已保存（示意）" aria-label="确认保存">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.4 2.4 4.6-4.8"/></svg>
        <span>确认</span>
      </button>
    </div>

    <div class="card profile-card" data-od-id="avatar-measures">
      <div class="sec-hd">
        <h2>身材档案</h2>
        <button class="more" data-nav="02-basic-info.html">编辑<svg class="ic" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
      </div>
      <div class="profile-grid">
        <div class="p-cell"><span class="pc-label">身高</span><span class="pc-val">168cm</span></div>
        <div class="p-cell"><span class="pc-label">体重</span><span class="pc-val">55kg</span></div>
        <div class="p-cell"><span class="pc-label">腰围</span><span class="pc-val">66cm</span></div>
        <div class="p-cell"><span class="pc-label">腿长</span><span class="pc-val">96cm</span></div>
      </div>
    </div>
  </main>

  <div class="footer-bar">
    <button class="btn" data-nav="06-tryon-select.html" data-od-id="avatar-tryon">去试穿</button>
  </div>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
</body>
</html>
