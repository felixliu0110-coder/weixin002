<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>12 · 试穿生成中 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">

<body class="wx-page" data-od-id="screen-tryon-progress" data-screen="12-tryon-progress.html">
  <header class="nav">
    <button class="nav-btn" data-nav="11-image-preview.html" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <span class="nav-title">试穿生成中</span>
  </header>

  <main class="content big-hero-center">
    <div class="ring-wrap">
      <div class="ring" id="tryonRing" data-od-id="tryon-ring" aria-hidden="true"></div>
      <div class="ring-num mono" id="tryonNum" aria-live="polite">0%</div>
    </div>
    <p class="gen-title">正在为你试穿针织连衣裙...</p>
    <p class="gen-sub">以你的 3D 数字人为底图生成照片级效果</p>

    <div class="gen-cards">
      <div class="gen-card">
        <span class="gc-ic"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>
        <div class="gc-label">排队中</div>
        <div class="gc-val">第 2 位（示例）</div>
      </div>
      <div class="gen-card">
        <span class="gc-ic"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5 13.8 9 19.5 11l-5.7 2-1.8 5.5L10.2 13l-5.7-2 5.7-2Z"/></svg></span>
        <div class="gc-label">预计耗时</div>
        <div class="gc-val">15 秒</div>
      </div>
    </div>

    <p class="hint center mt-20">生成完成后将通过微信消息通知你</p>
  </main>

  <nav class="tabbar" data-od-id="tryon-progress-tabbar">
    <button data-nav="17-home.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>发现</button>
    <button class="on" data-nav="06-tryon-select"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5a2.5 2.5 0 1 1 2.4 3.2H9.6A2.5 2.5 0 0 1 12 6.5Z"/><path d="M6.5 11.5 4 18h16l-2.5-6.5"/><path d="M8 12h8"/></svg>试衣</button>
    <button data-nav="13-tryon-history.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9Z"/></svg>收藏</button>
    <button data-nav="08-profile.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-6.5 8-6.5s8 2 8 6.5"/></svg>我的</button>
  </nav>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
  <script>
    OD.ring(document.getElementById("tryonRing"), document.getElementById("tryonNum"), 45, 3000, function () {
      OD.navAfter("07-tryon-result.html", 1600, "生成完成 · AI 生成效果，仅供参考");
    });
  </script>
