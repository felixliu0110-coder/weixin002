name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - name: miniprogram npm ci + test + verify
        working-directory: miniprogram
        run: |
          npm ci
          npm test
          npm run verify
      - name: cloud services test
        working-directory: cloudfunctions/services
        run: npm test
