  </defs>
  <g filter="url(#hand)" fill="none" stroke="#C0846B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 鞋底 -->
    <path d="M10 36c0-2 1.5-3.5 3.5-3.5h21c2 0 3.5 1.5 3.5 3.5v3c0 1.5-1 2.5-2.5 2.5H12.5c-1.5 0-2.5-1-2.5-2.5z" fill="#F5E6DC" stroke-width="2.2"/>
