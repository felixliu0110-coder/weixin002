<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="hand" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#hand)" fill="none" stroke="#C0846B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 帽顶 -->
    <path d="M14 20c0-7 5.5-12 10-12s10 5 10 12" fill="#F5E6DC" stroke-width="2.2"/>
    <!-- 帽檐 -->
    <path d="M8 20c0-2.5 2-4 4-4h24c2 0 4 1.5 4 4 0 2.5-2 4-4 4H12c-2 0-4-1.5-4-4z" fill="#F5E6DC" stroke-width="2.2"/>
    <!-- 顶部纽扣/装饰 -->
    <circle cx="24" cy="11" r="2" fill="#C0846B" stroke="none"/>
    <!-- 帽身折线 -->
    <path d="M14 20h20" stroke-width="1.6"/>
    <!-- 帽檐下沿缝线 -->
    <path d="M10 24h28" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>
</svg>
