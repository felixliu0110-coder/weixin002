<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>16 · 反馈与关于 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-feedback-about" data-screen="16-feedback-about.html">
  <header class="nav">
    <button class="nav-btn" data-nav="08-profile.html" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <span class="nav-title">关于我们</span>
  </header>

  <main class="content">
    <label class="field-label" for="fbText" style="margin-top:2px">遇到的问题或建议</label>
    <textarea class="textarea" id="fbText" placeholder="请输入你的意见或建议..." maxlength="200" data-od-id="feedback-input" aria-label="意见反馈内容"></textarea>

    <button class="btn block" style="margin-top:14px" id="fbSubmit" data-toast="提交成功，我们将在 3 个工作日内回复" data-od-id="feedback-submit">提交反馈</button>
    <div class="form-success" id="fbOk" role="status">
      <svg class="ic" viewBox="0 0 24 24"><path d="m6 12.5 4 4L18 8"/></svg>
      已提交，我们将在 3 个工作日内回复
    </div>

    <div class="sec-hd"><h2>关于我形我衣</h2></div>
    <div class="about-list" data-od-id="about-list">
      <div class="about-item"><b>AI 生成说明</b>试穿效果图由 AI 生成，仅供参考，可能与实物存在色差与形变。</div>
      <div class="about-item"><b>深度合成备案</b>已完成算法备案，生成结果按要求添加显式标识。</div>
      <div class="about-item"><b>联系方式</b>support@myshape.app</div>
    </div>
  </main>

  <div class="footer-bar">
    <button class="btn" data-nav="08-profile.html" data-od-id="about-next">下一步</button>
  </div>

  <nav class="tabbar pill" data-od-id="about-tabbar">
    <button data-nav="17-home.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>发现</button>
    <button data-nav="06-tryon-select.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5a2.5 2.5 0 1 1 2.4 3.2H9.6A2.5 2.5 0 0 1 12 6.5Z"/><path d="M6.5 11.5 4 18h16l-2.5-6.5"/><path d="M8 12h8"/></svg>试衣</button>
    <button data-nav="13-tryon-history.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9Z"/></svg>收藏</button>
    <button class="on" data-nav="08-profile"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-6.5 8-6.5s8 2 8 6.5"/></svg>我的</button>
  </nav>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
  <script>
    function markSent() {
      document.getElementById("fbOk").classList.add("show");
      document.getElementById("fbText").value = "";
    }
    document.getElementById("fbText").addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        markSent();
      }
    });
    document.getElementById("fbSubmit").addEventListener("click", markSent);
  </script>
</body>
</html>
