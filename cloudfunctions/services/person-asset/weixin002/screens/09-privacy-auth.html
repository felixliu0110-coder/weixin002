<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>09 · 隐私授权 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-privacy-auth" data-screen="09-privacy-auth.html">
  <div class="auth-page" id="authPage">
    <div class="auth-card">
      <h1>隐私授权说明</h1>
      <div class="auth-list">
        <div class="auth-item"><span class="dot"></span><span>人脸照片仅用于数字人头部重建，不会用于其他用途</span></div>
        <div class="auth-item"><span class="dot"></span><span>身体数据加密存储（AES-256），可随时删除</span></div>
        <div class="auth-item"><span class="dot"></span><span>照片与数据不用于任何第三方模型训练</span></div>
      </div>
      <div class="auth-actions">
        <button class="btn secondary" id="declineBtn" data-od-id="privacy-decline">不同意</button>
        <button class="btn" data-nav="10-generate-progress.html" data-od-id="privacy-accept">同意并继续</button>
      </div>
    </div>
  </div>
  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
  <script>
    document.getElementById("declineBtn").addEventListener("click", function () {
      OD.navAfter("04-photo-upload.html", 1400, "未同意前不采集任何照片，将使用默认形象");
    });
    document.getElementById("authPage").addEventListener("click", function (ev) {
      if (ev.target === this) {
        OD.navAfter("04-photo-upload.html", 1100, "已返回创建向导，可稍后继续");
      }
    });
  </script>
</body>
</html>
