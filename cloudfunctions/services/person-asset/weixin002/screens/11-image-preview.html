<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>11 · 衣物预览 · 我形我衣</title>
  <link rel="stylesheet" href="../assets/proto.css?v=16">
</head>
<body class="wx-page" data-od-id="screen-image-preview" data-screen="11-image-preview.html">
  <header class="nav">
    <button class="nav-btn" data-nav="06-tryon-select.html" aria-label="返回">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg>
    </button>
    <span class="nav-title">衣物预览</span>
  </header>

  <main class="content">
    <p class="subtitle">系统已完成自动抠图与方向矫正，请确认品类后生成试穿。</p>

    <div class="photo-card">
      <img src="../assets/img/p11-garment.png" alt="粉色针织连衣裙，已自动抠图">
      <span class="badge-cut" style="top:auto;bottom:12px;left:12px;right:auto">已自动抠图</span>
    </div>

    <div class="sec-hd" style="margin-top:18px"><h2>品类识别</h2><span class="hint">可手动修正</span></div>
    <div class="chip-row" data-od-id="preprocess-category">
      <button class="chip" data-chip="上装" data-chip-group="cat" data-chip-toast="品类已修正为：上装">上装</button>
      <button class="chip on" data-chip="下装" data-chip-group="cat" data-chip-toast="品类已修正为：下装">下装</button>
      <button class="chip" data-chip="连衣裙" data-chip-group="cat" data-chip-toast="品类已修正为：连衣裙">连衣裙</button>
      <button class="chip" data-chip="外套" data-chip-group="cat" data-chip-toast="品类已修正为：外套">外套</button>
    </div>

    <p class="step-note">非衣物、多人合照或涉敏图片会被拦截，不会进入生成流程。</p>
  </main>

  <div class="footer-bar">
    <button class="btn" data-nav="12-tryon-progress.html" data-od-id="preprocess-confirm">确认生成试穿</button>
  </div>

  <nav class="tabbar" data-od-id="preview-tabbar">
    <button data-nav="17-home.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/></svg>发现</button>
    <button class="on" data-nav="06-tryon-select"><svg class="ic" viewBox="0 0 24 24"><path d="M12 6.5a2.5 2.5 0 1 1 2.4 3.2H9.6A2.5 2.5 0 0 1 12 6.5Z"/><path d="M6.5 11.5 4 18h16l-2.5-6.5"/><path d="M8 12h8"/></svg>试衣</button>
    <button data-nav="13-tryon-history.html"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9-9a5 5 0 0 1 9-3 5 5 0 0 1 9 3c-2 4.4-9 9-9 9Z"/></svg>收藏</button>
    <button data-nav="08-profile.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.5 3.6-6.5 8-6.5s8 2 8 6.5"/></svg>我的</button>
  </nav>

  <div class="toast" role="status"></div>
  <script src="../assets/proto.js"></script>
</body>
</html>
